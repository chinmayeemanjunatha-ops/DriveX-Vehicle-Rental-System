
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Trucks</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #080808;
            padding: 18px 7%;
        }

        nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            color: #e6b92e;
        }

        .heading {
            text-align: center;
            padding: 35px 15px 50px;
        }

        .heading h1 {
            color: #e6b92e;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: white;
        }

        /* Truck card alignment */
        .vehicle-container {
            display: grid;
            grid-template-columns: repeat(2, 275px);
            justify-content: center;
            align-items: stretch;
            column-gap: 30px;
            row-gap: 30px;

            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            padding: 20px 15px 40px;
        }

        .vehicle-card {
            width: 275px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .vehicle-card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
            border-radius: 8px;
        }

        .vehicle-card h2 {
            color: #e6b92e;
            margin-top: 25px;
        }

        .vehicle-card p {
            color: #ccc;
            line-height: 1.5;
        }

        .price {
            color: #e6b92e !important;
            font-size: 19px;
            font-weight: bold;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            background: #e6b92e;
            color: #111;
            padding: 14px 25px;
            margin-top: 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

        /* Mobile screen alignment */
        @media (max-width: 650px) {
            .vehicle-container {
                grid-template-columns: minmax(230px, 275px);
                gap: 25px;
            }

            nav {
                gap: 25px;
            }
        }

    </style>
</head>

<body>

<header>
    <nav>
        <a href="/frontend/index.html">Home</a>
        <a href="/frontend/about.html">About</a>
        <a href="/contact.html">Contact</a>
    </nav>
</header>

<section class="heading">
    <h1>Our Trucks</h1>
    <p>Choose your preferred truck and book it with DriveX.</p>
</section>

<section class="vehicle-container">

    <!-- Tata 407 -->
    <div class="vehicle-card">

        <img src="images/tata407.jpg" alt="Tata 407">

        <h2>Tata 407</h2>

        <p>Reliable truck for transportation.</p>

        <p class="price">₹400 / hour</p>

        <a href="/booking.html?vehicle=Tata%20407"
           class="btn">Book Now</a>

    </div>

    <!-- Tata LPT 1618 -->
    <div class="vehicle-card">

        <img src="images/tata1618.jpg" alt="Tata LPT 1618">

        <h2>Tata LPT 1618</h2>

        <p>Heavy-duty truck for larger loads.</p>

        <p class="price">₹700 / hour</p>

        <a href="/booking.html?vehicle=Tata%20LPT%201618"
           class="btn">Book Now</a>

    </div>

</section>

<footer>
    <p>© 2026 DriveX Vehicle Rental System. All Rights Reserved.</p>
</footer>

</body>
</html>
